name: Deploy to Environment. (dev/qa/uat/prod)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
          - dev-sandbox
          - qa-sandbox

concurrency:
  # One deploy in flight per environment. Unlike the scratch-org workflows, a deploy here mutates a
  # real, persistent org mid-flight — cancelling it partway through would be worse than just queuing
  # the next run behind it, so cancel-in-progress is explicitly off (default is false; stated here
  # so it can't be missed).
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  # contents: write is required so the last step can push the deployed-<environment> tracking tag.
  contents: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Ties this job to the matching GitHub Environment (dev/qa/uat/prod), which is where the
    # environment-scoped CONSUMER_KEY/JWT_KEY/USERNAME secrets live, and where uat/prod's
    # "Deployment branches and tags" restriction is enforced — GitHub blocks the run before any
    # of these steps execute if the triggering ref isn't on that environment's allow-list.
    environment: ${{ inputs.environment }}

    steps:
      # Step 1: Check out whatever branch/tag the CI/CD team picked in the workflow_dispatch "Use
      # workflow from" selector. fetch-depth: 0 and fetch-tags are both required — delta computation
      # needs full history plus the deployed-<environment> tag from a previous run.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Step 2: Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 hits a crash in @salesforce/cli's bundled undici
          # (calls worker_threads.markAsUncloneable, added only in Node >=22.10)
          node-version: 22

      # Step 3: Install Salesforce CLI and the git-delta plugin used to compute what changed.
      # sfdx-git-delta isn't digitally signed by Salesforce (it's a widely-used community plugin,
      # not an official one), so "sf plugins install" prompts "This plugin is not signed... Do you
      # want to continue installation? (y/N)". --force does NOT suppress this specific prompt (only
      # the reinstall-if-already-present confirmation) — with no stdin on a GitHub Actions runner,
      # the unanswered prompt would just hang until the job times out. Piping "y" into it answers
      # the prompt directly, which is the actual fix; --force is kept alongside for the reinstall
      # case, but the piped "y" is what unblocks this.
      - name: Install Salesforce CLI
        run: |
          # Pinned rather than @latest: this exact version is what the runs used when the
          # RunSpecifiedTests/Quick-Deploy investigation above was done. An unpinned install lets
          # upstream CLI behavior drift silently between runs with no corresponding change in this
          # repo - bump deliberately (and re-verify a real deploy still lands) rather than
          # automatically.
          npm install -g @salesforce/cli@2.147.7
          echo y | sf plugins install sfdx-git-delta --force

      # Step 4: Authenticate to the target org using the JWT bearer flow — same pattern already used
      # for Dev Hub auth in scratch-org-validation.yml/scratch-org-create.yml, but pointed at this
      # environment's own org via the GitHub Environment's CONSUMER_KEY/JWT_KEY/USERNAME secrets
      # (same secret names, different values per environment) instead of a Dev Hub.
      #
      # --- Permissions the TARGET_USERNAME user needs in each org ---
      # Required regardless of what's being deployed: API Enabled, Author Apex (to deploy Apex and
      # run tests), Modify Metadata Through Metadata API Functions. Also needs to be pre-authorized
      # for this org's Connected App (Admin approved users are pre-authorized + a permission set
      # assignment, or a profile restriction on the app).
      # Recommended: assign this user the System Administrator profile rather than hand-picking a
      # narrow permission set. Metadata deploys are inherently broad (Apex, LWC, Flows, Permission
      # Sets, custom objects, layouts, ...), and a scoped-down profile tends to break the pipeline
      # the moment force-app gains a new metadata type, rather than acting as a real security
      # boundary — the actual boundary here is the JWT cert/key and who can trigger this workflow.
      # Object-level permissions specifically: as of this writing (AccountSelector.cls,
      # AccountRatingService.cls) the only object touched is the standard Account object, both
      # classes are "with sharing" but don't use WITH SECURITY_ENFORCED / stripInaccessible /
      # WITH USER_MODE, and Apex runs in system mode by default — so this user's own object/field
      # permissions aren't actually exercised by today's code. That changes the moment any class
      # adds explicit CRUD/FLS enforcement or a test starts using System.runAs to impersonate a more
      # restricted user — at that point, this user's Read/Create/Edit access on whatever objects
      # that code touches starts to matter for whether deploys/tests pass.
      - name: Authenticate to Target Org (JWT Bearer Flow)
        env:
          TARGET_JWT_KEY: ${{ secrets.JWT_KEY }}
          TARGET_CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          TARGET_USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "$TARGET_JWT_KEY" > server.key

          sf org login jwt \
            --client-id "$TARGET_CONSUMER_KEY" \
            --jwt-key-file server.key \
            --username "$TARGET_USERNAME" \
            --alias target-org

          # Remove the private key from disk as soon as it's no longer needed.
          rm server.key

          # Log which org/user this run actually hit — the first thing needed when a run's
          # behavior looks wrong. Default (non --verbose) "sf org display" output does not
          # include the access/refresh token, so this is safe to print.
          echo "--- Target org identity ---"
          sf org display --target-org target-org --json | jq '{id: .result.id, username: .result.username, instanceUrl: .result.instanceUrl, alias: .result.alias}'
          echo "----------------------------"

      # Step 5: Compute the delta since the last successful deploy to this environment.
      #
      # --- Delta strategy, end to end ---
      # Each environment (dev/qa/uat/prod) has its own independent "high water mark": a git tag named
      # deployed-<environment> that always points at the commit last successfully deployed to that
      # specific org. That tag is the *only* state this whole mechanism depends on — there's no
      # database, no external tracking file, just one movable tag per environment living in this repo.
      #
      # On every run:
      #   FROM = the commit deployed-<environment> currently points at (read via git rev-parse).
      #   TO   = the commit being deployed right now (github.sha, i.e. the tip of whatever branch/tag
      #          was picked when the workflow was dispatched).
      # sfdx-git-delta then runs the equivalent of `git diff --name-status FROM TO` scoped to
      # force-app/, and translates the changed/added files into a package.xml Salesforce can deploy.
      # This is what makes each run push *only what changed for that environment* rather than the
      # whole org every time — qa and prod can sit at completely different points in history and each
      # only ever receives its own outstanding delta.
      #
      # Bootstrap case: if deployed-<environment> doesn't exist yet (first-ever deploy to that
      # environment), FROM falls back to git's well-known empty-tree SHA, so the diff is computed
      # against "nothing" and every file counts as new — the first deploy is naturally a full deploy,
      # with no special-casing needed anywhere else in this workflow.
      #
      # Destructive changes (deleted metadata) are intentionally NOT handled yet — see the commented-
      # out block below and in the "Deploy Changes (Phase 2 - Real)" step. sfdx-git-delta would also emit
      # .deploy-delta/destructiveChanges/destructiveChanges.xml for anything removed from force-app,
      # but until that's re-enabled, deletions in source won't be reflected in the target orgs.
      #
      # Known caveat: this only knows about commits in *this* repo's history. Any deploy made outside
      # this pipeline (e.g. straight from VS Code) doesn't move the deployed-<environment> tag, so the
      # next pipeline run's delta would be computed against a stale baseline.
      - name: Compute Delta
        id: delta
        run: |
          # --verify --quiet is required here, not just "git rev-parse <ref> 2>/dev/null || ...":
          # for a ref that doesn't exist (the normal case on a first-ever deploy to an environment),
          # plain "git rev-parse <ref>" still echoes the ref name itself to STDOUT as a last-resort
          # "maybe this is a pathname" fallback, in addition to erroring and exiting non-zero.
          # 2>/dev/null only silences stderr, so that stdout echo survives into the command
          # substitution, and the "|| echo <empty-tree-sha>" fallback then adds a SECOND line on top
          # of it — leaving FROM as both strings concatenated, which broke sfdx-git-delta with
          # "--from is not a valid sha pointer". --verify --quiet skips that pathname fallback
          # entirely and prints nothing to stdout on failure, so exactly one line ends up in FROM.
          FROM=$(git rev-parse --verify --quiet "refs/tags/deployed-${{ inputs.environment }}" 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)
          TO="${{ github.sha }}"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"

          mkdir -p .deploy-delta
          # --ignore .forceignore is required: sfdx-git-delta infers a component's type/name purely
          # from its file path and isn't .gitkeep-aware, so without this it misreads placeholder
          # .gitkeep files in otherwise-empty scaffold folders as real metadata (e.g. a PermissionSet
          # named "default", a StaticResource named ".gitkeep") — package.xml entries that don't
          # correspond to anything real, which "sf project deploy validate" then rejects with
          # "named in package.xml but not found in zipped directory". .forceignore already lists
          # **/.gitkeep for exactly this reason.
          sf sgd:source:delta \
            --from "$FROM" \
            --to "$TO" \
            --source-dir force-app \
            --ignore .forceignore \
            --output-dir .deploy-delta

          PACKAGE_XML=".deploy-delta/package/package.xml"
          SCHEMA_XML=".deploy-delta/package/schema-phase.xml"
          REST_XML=".deploy-delta/package/rest-phase.xml"
          # DESTRUCTIVE_XML=".deploy-delta/destructiveChanges/destructiveChanges.xml"  # disabled for now — see strategy note above

          # Print the exact manifest sfdx-git-delta produced, directly in this step's log —
          # the "Write Delta Summary" step below only renders a reformatted table, and only when
          # has-changes is true. Having the raw XML here too means a bad/unexpected delta is
          # visible immediately, without waiting on that later step.
          echo "--- Generated package.xml ---"
          if [ -f "$PACKAGE_XML" ]; then
            cat "$PACKAGE_XML"
          else
            echo "(none generated)"
          fi
          echo "------------------------------"

          HAS_ADDS="false"
          HAS_SCHEMA="false"
          HAS_REST="false"

          if [ -f "$PACKAGE_XML" ] && grep -q "<types>" "$PACKAGE_XML"; then
            HAS_ADDS="true"

            # Split the combined manifest into a schema-only phase (CustomObject/CustomField)
            # and everything else. Why this split exists: see the comment above the "Deploy
            # Schema (Phase 1 - Real, No Tests)" step below. A separate script (not an inline
            # heredoc) because this output is fed straight back into "sf project deploy" as real
            # manifests and needs to be well-formed - unlike the read-only, display-only awk
            # parsing in "Write Delta Summary" below, a malformed manifest here would break the
            # actual deploy. python3 is preinstalled on GitHub-hosted ubuntu runners.
            python3 .github/scripts/split_delta_package.py "$PACKAGE_XML" "$SCHEMA_XML" "$REST_XML"

            if grep -q "<types>" "$SCHEMA_XML"; then
              HAS_SCHEMA="true"
            fi
            if grep -q "<types>" "$REST_XML"; then
              HAS_REST="true"
            fi

            echo "--- schema-phase.xml (Phase 1) ---"
            cat "$SCHEMA_XML"
            echo "--- rest-phase.xml (Phase 2) ---"
            cat "$REST_XML"
            echo "-----------------------------------"
          fi

          # HAS_DESTRUCTIVE="false"
          # if [ -f "$DESTRUCTIVE_XML" ] && grep -q "<types>" "$DESTRUCTIVE_XML"; then
          #   HAS_DESTRUCTIVE="true"
          # fi

          echo "has-changes=$HAS_ADDS" >> "$GITHUB_OUTPUT"
          echo "has-schema-changes=$HAS_SCHEMA" >> "$GITHUB_OUTPUT"
          echo "has-rest-changes=$HAS_REST" >> "$GITHUB_OUTPUT"
          # echo "has-destructive=$HAS_DESTRUCTIVE" >> "$GITHUB_OUTPUT"

      # Step 6: Nothing to deploy — record it and stop here (success, no-op). Keeps re-runs against
      # an already-deployed commit cheap and unambiguous instead of erroring or silently deploying
      # an empty package.
      - name: Write "No Changes" Summary
        if: steps.delta.outputs.has-changes == 'false'
        run: |
          {
            echo "## No Changes to Deploy — ${{ inputs.environment }}"
            echo ""
            echo "No metadata has changed since the last successful deploy to **${{ inputs.environment }}** (\`${{ steps.delta.outputs.from }}\` → \`${{ steps.delta.outputs.to }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 7: Audit trail — list exactly what the delta step picked up, before the deploy attempt
      # even runs. This is the answer to "what changed" for anyone reviewing a run afterward, and the
      # first place to check if something that should have deployed didn't, or vice versa. Runs
      # regardless of whether the deploy step that follows succeeds or fails.
      #
      # Parsing assumes package.xml is pretty-printed one-element-per-line, which is how
      # sfdx-git-delta generates it — re-verify with one manual run if this step ever misbehaves.
      - name: Write Delta Summary
        if: steps.delta.outputs.has-changes == 'true'
        run: |
          render_table() {
            awk '
              /<types>/ { members = "" ; next }
              /<members>/ {
                gsub(/<members>|<\/members>/, "");
                gsub(/^[ \t]+|[ \t]+$/, "");
                members = members (members == "" ? "" : ", ") $0;
                next
              }
              /<name>/ {
                gsub(/<name>|<\/name>/, "");
                gsub(/^[ \t]+|[ \t]+$/, "");
                print "| " $0 " | " members " |"
              }
            ' "$1"
          }

          SCHEMA_XML=".deploy-delta/package/schema-phase.xml"
          REST_XML=".deploy-delta/package/rest-phase.xml"

          {
            echo "## Delta Picked Up for ${{ inputs.environment }}"
            echo ""
            echo "Diffing \`${{ steps.delta.outputs.from }}\` → \`${{ steps.delta.outputs.to }}\`."
            echo ""

            if [ "${{ steps.delta.outputs.has-schema-changes }}" = "true" ]; then
              SCHEMA_TYPES=$(grep -c "<name>" "$SCHEMA_XML" || echo 0)
              SCHEMA_MEMBERS=$(grep -c "<members>" "$SCHEMA_XML" || echo 0)
              echo "### Phase 1 — Schema ($SCHEMA_MEMBERS component(s) across $SCHEMA_TYPES type(s))"
              echo ""
              echo "| Metadata Type | Members |"
              echo "|---------------|---------|"
              render_table "$SCHEMA_XML"
              echo ""
            else
              echo "### Phase 1 — Schema"
              echo "No CustomObject/CustomField changes in this delta — phase 1 will be skipped."
              echo ""
            fi

            if [ "${{ steps.delta.outputs.has-rest-changes }}" = "true" ]; then
              REST_TYPES=$(grep -c "<name>" "$REST_XML" || echo 0)
              REST_MEMBERS=$(grep -c "<members>" "$REST_XML" || echo 0)
              echo "### Phase 2 — Everything Else ($REST_MEMBERS component(s) across $REST_TYPES type(s))"
              echo ""
              echo "| Metadata Type | Members |"
              echo "|---------------|---------|"
              render_table "$REST_XML"
            else
              echo "### Phase 2 — Everything Else"
              echo "No non-schema changes in this delta — phase 2 will be skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 8: Deploy schema (CustomObject/CustomField) for real, before anything tries to test
      # against it.
      #
      # --- Why a schema phase exists ---
      # Confirmed on a real failed run (validate job 0AfDQ000009g22p0AA, 2026-09-04): a delta that
      # bundles brand-new CustomObjects/CustomFields together with Apex test classes that depend on
      # that schema (query/insert it, etc.) validated cleanly (numberComponentErrors: 0,
      # runTestsEnabled: true) but ran ZERO tests (numTestsRun: 0). Because a checkOnly validate
      # never actually commits anything, the schema never truly exists mid-transaction for the test
      # run to execute against - Salesforce silently skips the tests rather than erroring. Salesforce
      # then refuses to Quick Deploy a validation that ran zero tests (CannotQuickDeployError:
      # "Source validate did not run tests in the org"), so nothing ever lands. Deploying schema for
      # real first means Phase 2's Apex/tests validate against schema that genuinely exists.
      #
      # test-level NoTestRun is safe here: schema-only changes (CustomObject/CustomField) don't
      # themselves carry Apex test coverage requirements - Phase 2 below still runs the full suite
      # against everything else.
      #
      # Deliberately NOT continue-on-error: if real schema can't be deployed, Phase 2 (which may
      # depend on it) must not be attempted - the job stops here.
      - name: Deploy Schema (Phase 1 - Real, No Tests)
        id: schema-deploy
        if: steps.delta.outputs.has-schema-changes == 'true'
        run: |
          mkdir -p deploy-results

          set +e
          sf project deploy start \
            --manifest .deploy-delta/package/schema-phase.xml \
            --target-org target-org \
            --test-level NoTestRun \
            --wait 30 \
            --json > deploy-results/schema-deploy-result.json
          SCHEMA_DEPLOY_EXIT_CODE=$?
          set -e

          echo "--- sf project deploy start (schema) exited $SCHEMA_DEPLOY_EXIT_CODE ---"
          cat deploy-results/schema-deploy-result.json
          echo "-----------------------------------------------------------------------"

          {
            echo "## Phase 1 — Schema Deploy Result — ${{ inputs.environment }}"
            echo ""
            if [ "$SCHEMA_DEPLOY_EXIT_CODE" -eq 0 ]; then
              echo "✅ Schema (CustomObject/CustomField) deployed successfully."
            else
              echo "❌ Schema deploy failed — stopping before Phase 2. See the job log / uploaded diagnostics for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $SCHEMA_DEPLOY_EXIT_CODE

      # Step 9: Deploy the Phase 2 delta (everything except schema) for real - compiles it, runs
      # the required Apex tests, and commits atomically. Salesforce rolls back the whole deploy if
      # any test fails or coverage is insufficient - the same guarantee a checkOnly validate would
      # have given, just without a separate promotion step.
      #
      # --- Why this is a single real deploy, not validate-then-quick-deploy ---
      # Confirmed on a real run (validate job 0AfDQ000009g2340AA, 2026-09-04): even with schema
      # deployed for real in Phase 1, a checkOnly validate of Apex classes never before committed
      # to this org reported numberTestsTotal: 0, despite those classes compiling successfully.
      # RunLocalTests enumerates tests from the org's already-persisted Apex; a checkOnly
      # transaction never persists anything, so brand-new classes don't count as "local" yet even
      # though they compile. Salesforce then refuses to Quick Deploy a validation that ran zero
      # tests. This isn't specific to this one bootstrap case - it recurs for any future delta that
      # introduces a brand-new Apex class. The validate-then-quick-deploy split exists to preview a
      # deploy before committing without re-running tests twice; this workflow never actually used
      # that (it always promoted immediately on validate success), so the split was pure downside
      # here. A single real deploy sidesteps the entire category of "not yet real for
      # RunLocalTests" bugs, not just today's case.
      #
      # Destructive changes (deletions) are disabled for now — deleted metadata in force-app won't be
      # removed from the target org by this workflow. To re-enable: uncomment the HAS_DESTRUCTIVE /
      # has-destructive lines in "Compute Delta" above, and add the equivalent
      # --post-destructive-changes flag to this step.
      #
      # continue-on-error lets the gate step below still parse and report on a failed deploy's JSON
      # output; the step itself still exits non-zero on a real failure so its own outcome in the
      # Actions UI is accurate.
      - name: Deploy Changes (Phase 2 - Real)
        id: deploy
        if: steps.delta.outputs.has-rest-changes == 'true'
        continue-on-error: true
        run: |
          mkdir -p deploy-results

          # --json mode makes the CLI suppress ALL human-readable console output, success or
          # failure, and instead write one JSON blob to stdout (redirected below into the results
          # file) — nothing is duplicated to stderr/console. Combined with bash's default -e, a
          # non-zero exit here would silently abort the script with no visible diagnostic at all.
          # set +e/-e around the call preserves the step's real outcome (still fails if this fails)
          # while letting the script continue far enough to print the JSON either way — see the
          # "exit $DEPLOY_EXIT_CODE" at the end of this step.
          set +e
          sf project deploy start \
            --manifest .deploy-delta/package/rest-phase.xml \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json > deploy-results/deploy-result.json
          DEPLOY_EXIT_CODE=$?
          set -e

          echo "--- sf project deploy start (phase 2) exited $DEPLOY_EXIT_CODE ---"
          cat deploy-results/deploy-result.json
          echo "-----------------------------------------------------------------"

          exit $DEPLOY_EXIT_CODE

      # Step 10: Report on the Phase 2 deploy and enforce our stricter, per-class 75% coverage
      # minimum on top of Salesforce's own org-wide check (same 75% bar used in
      # scratch-org-validation.yml's PR gate). Note: by the time this step runs, a successful
      # deploy has already landed in the target org — Salesforce deploys are transactional, so
      # failing this step for a per-class shortfall marks the run red for visibility and blocks the
      # tracking-tag update below, but it can't itself undo metadata that already deployed cleanly.
      # If reached at all, Phase 1 (schema) already either succeeded or was skipped (no schema
      # changes in this delta) — a real Phase 1 failure stops the job before this step ever runs.
      - name: Enforce Deploy & Coverage Gates (Phase 2)
        id: enforce-gates
        if: steps.delta.outputs.has-rest-changes == 'true'
        run: |
          # Field names below (result.status, result.success, result.details.runTestResult.*) match
          # the metadata Deploy API's current shape as surfaced by "sf project deploy start --json";
          # like the equivalent gate in scratch-org-validation.yml, re-verify with one manual run if
          # this step ever misbehaves.
          DEPLOY_RESULTS_FILE="deploy-results/deploy-result.json"

          if [ ! -s "$DEPLOY_RESULTS_FILE" ]; then
            echo "::error::Deploy results file missing or empty — sf project deploy start likely crashed before producing output."
            echo "## ❌ Deploy Failed to Produce Results" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          DEPLOY_STATUS=$(jq -r '.result.status // "unknown"' "$DEPLOY_RESULTS_FILE")
          DEPLOY_SUCCESS=$(jq -r '.result.success // false' "$DEPLOY_RESULTS_FILE")
          NUM_TESTS_RUN=$(jq -r '.result.details.runTestResult.numTestsRun // 0' "$DEPLOY_RESULTS_FILE")
          NUM_FAILURES=$(jq -r '.result.details.runTestResult.numFailures // 0' "$DEPLOY_RESULTS_FILE")

          FAILED_TESTS_MD=$(jq -r '
            [.result.details.runTestResult.failures[]?]
            | if length == 0 then "" else
                (["| Test | Message |", "|------|---------|"] +
                 (map("| " + (.name // "") + "." + (.methodName // "") + " | " + ((.message // "") | gsub("\\|"; "\\|") | gsub("\n"; " ")) + " |")))
                | join("\n")
              end
          ' "$DEPLOY_RESULTS_FILE")

          UNDER_COVERED_MD=$(jq -r '
            [.result.details.runTestResult.codeCoverage[]?
              | select(.numLocations > 0)
              | . + {coveredPercent: (((.numLocations - .numLocationsNotCovered) / .numLocations) * 100)}
              | select(.coveredPercent < 75)]
            | if length == 0 then "" else
                (["| Class | Coverage | Covered/Total Lines |", "|-------|----------|---------------------|"] +
                 (map("| " + .name + " | " + (.coveredPercent | floor | tostring) + "% | "
                      + ((.numLocations - .numLocationsNotCovered) | tostring) + "/" + (.numLocations | tostring) + " |")))
                | join("\n")
              end
          ' "$DEPLOY_RESULTS_FILE")

          UNDER_COVERED_COUNT=$(jq '
            [.result.details.runTestResult.codeCoverage[]?
              | select(.numLocations > 0)
              | select((((.numLocations - .numLocationsNotCovered) / .numLocations) * 100) < 75)]
            | length
          ' "$DEPLOY_RESULTS_FILE")

          SCHEMA_PHASE_NOTE="skipped (no schema changes in this delta)"
          if [ "${{ steps.delta.outputs.has-schema-changes }}" = "true" ]; then
            SCHEMA_PHASE_NOTE="✅ deployed"
          fi

          {
            echo "## Deploy Result — ${{ inputs.environment }}"
            echo ""
            echo "- Phase 1 (schema): $SCHEMA_PHASE_NOTE"
            if [ "$DEPLOY_SUCCESS" = "true" ]; then
              echo "- Phase 2 deploy: ✅ committed (status: $DEPLOY_STATUS)"
            else
              echo "- Phase 2 deploy: ❌ failed (status: $DEPLOY_STATUS) — nothing was committed to the org"
            fi
            echo "- Tests ran: $NUM_TESTS_RUN (failing: $NUM_FAILURES)"
            echo ""
            if [ -n "$FAILED_TESTS_MD" ]; then
              echo "### ❌ Failing Tests"
              echo "$FAILED_TESTS_MD"
              echo ""
            fi
            if [ -n "$UNDER_COVERED_MD" ]; then
              echo "### ⚠️ Classes Below 75% Coverage"
              echo "$UNDER_COVERED_MD"
              echo ""
            fi
            if [ "$DEPLOY_SUCCESS" = "true" ] && [ -z "$UNDER_COVERED_MD" ]; then
              echo "✅ Deploy succeeded, all tests passed, every touched class meets the 75% per-class coverage minimum."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          EXIT_CODE=0
          if [ "$DEPLOY_SUCCESS" != "true" ]; then
            echo "::error::Deploy to ${{ inputs.environment }} did not succeed (status: $DEPLOY_STATUS)."
            EXIT_CODE=1
          fi
          if [ "$UNDER_COVERED_COUNT" -gt 0 ]; then
            echo "::error::$UNDER_COVERED_COUNT class(es) touched by this deploy are below 75% coverage."
            EXIT_CODE=1
          fi
          exit $EXIT_CODE

      # Step 12: Only reached if Phase 1 (schema, if any) and the Phase 2 gate step above both
      # succeeded (a failed step stops the job by default, and a skipped step doesn't count as a
      # failure) — so this only runs once everything that needed to deploy for real actually did.
      # Move the tracking tag to the commit that was just deployed — this tag is the only state the
      # delta computation in Step 5 depends on for next time.
      - name: Record Successful Deploy
        if: steps.delta.outputs.has-changes == 'true'
        run: |
          git tag -f "deployed-${{ inputs.environment }}" "${{ github.sha }}"
          git push origin "refs/tags/deployed-${{ inputs.environment }}" -f

      # Step 12.5: Persist the full diagnostic bundle (delta manifests, schema-deploy JSON, Phase 2
      # deploy JSON) as a downloadable artifact, regardless of which step failed or whether there
      # were any changes to deploy at all. Without this, deploy-results/ and .deploy-delta/ only
      # ever existed on the ephemeral runner and were gone the moment the job finished — the only
      # way to root-cause a failure after the fact was to cross-check Salesforce Setup by hand.
      # if-no-files-found: ignore because both directories are conditionally created (e.g. never
      # on a no-changes run).
      - name: Upload Deploy Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            deploy-results/
            .deploy-delta/
          retention-days: 14
          if-no-files-found: ignore

      # Step 13: Report success/failure of this deploy to Slack, regardless of outcome (whether
      # there were changes to deploy or not, and whether the gate step above passed or failed).
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            COLOR="#2eb886"; EMOJI="✅"
          elif [ "$STATUS" = "cancelled" ]; then
            COLOR="#808080"; EMOJI="⚪"
          else
            COLOR="#e01e5a"; EMOJI="❌"
          fi

          # Built via jq --arg (not string interpolation) so a branch name or actor containing
          # quotes/backslashes can't break the JSON payload or inject extra fields.
          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg text "$EMOJI *$ENVIRONMENT Deploy — $STATUS*\n*Repo:* $REPO\n*Branch:* \`$BRANCH\`\n*Triggered by:* $ACTOR" \
            --arg url "$RUN_URL" \
            '{attachments: [{color: $color, blocks: [
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View Run"}, url: $url}]}
            ]}]}')

          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
