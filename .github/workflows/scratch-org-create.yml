name: Scratch Org Create (Developer Sandbox)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose metadata to deploy"
        required: true
        default: "develop"
      email:
        description: "Your email address (org login details will be sent here)"
        required: true

concurrency:
  # One create-run in flight per (branch, email) pair, so double-clicking "Run workflow" for the
  # same request doesn't spin up two separate 30-day scratch orgs.
  group: scratch-org-create-${{ inputs.branch }}-${{ inputs.email }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scratch-org-create:
    name: Create Long-Lived Scratch Org for Developer
    runs-on: ubuntu-latest

    steps:
      # Step 0: Fail fast on obviously bad inputs, before spending any Dev Hub auth or scratch-org
      # quota on a request that can't succeed anyway.
      - name: Validate Inputs
        env:
          BRANCH: ${{ inputs.branch }}
          EMAIL: ${{ inputs.email }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "::error::branch input is empty."
            exit 1
          fi

          if ! [[ "$EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::email input '$EMAIL' doesn't look like a valid email address."
            exit 1
          fi

      # Step 1: Check out the requested branch directly. Unlike scratch-org-validation.yml, there's
      # no PR here — the developer picked this branch by hand, so we check it out as-is. If the
      # branch doesn't exist, checkout fails with a clear git error.
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # Step 2: Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 hits a crash in @salesforce/cli's bundled undici
          # (calls worker_threads.markAsUncloneable, added only in Node >=22.10)
          node-version: 22

      # Step 3: Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Step 4: Authenticate to the Dev Hub using the JWT bearer flow.
      # Same approach as scratch-org-validation.yml — see that file's inline comments for the full
      # history of why (JWT over Auth URL, PlatformCLI signup workaround for the ECA-based Dev Hub).
      - name: Authenticate Dev Hub (JWT Bearer Flow)
        env:
          DEVHUB_JWT_KEY: ${{ secrets.DEVHUB_JWT_KEY }}
          DEVHUB_CONSUMER_KEY: ${{ secrets.DEVHUB_CONSUMER_KEY }}
          DEVHUB_USERNAME: ${{ secrets.DEVHUB_USERNAME }}
        run: |
          echo "$DEVHUB_JWT_KEY" > server.key

          sf org login jwt \
            --client-id "$DEVHUB_CONSUMER_KEY" \
            --jwt-key-file server.key \
            --username "$DEVHUB_USERNAME" \
            --set-default-dev-hub \
            --alias devhub

          # Remove the private key from disk as soon as it's no longer needed.
          rm server.key

      # Step 5: Create a scratch org for this developer to work in.
      # Long-lived (30 days, the max allowed) and never auto-deleted by this workflow — unlike
      # scratch-org-validation.yml's ephemeral, test-and-discard orgs, this one is meant to be
      # actually developed in for the life of the story.
      - name: Create Scratch Org
        id: create-scratch
        env:
          # Our Dev Hub is authenticated via an External Client App (ECA), which the scratch-org
          # signup service can't replicate into the newly created scratch org (fails with C-1016 /
          # RemoteOrgSignupFailed). Point signup at Salesforce's built-in PlatformCLI app instead,
          # just for this step, as the documented workaround.
          SF_SCRATCH_SIGNUP_CONNECTED_APP: PlatformCLI
          SF_SCRATCH_SIGNUP_CALLBACK_URL: http://localhost:1717/OauthRedirect
          # Passed through env rather than interpolated directly as ${{ inputs.branch }} below —
          # GitHub substitutes ${{ }} into the script's literal text before bash ever runs it, so a
          # branch name containing shell metacharacters ($, `, ", ;, etc.) would be interpreted by
          # bash instead of treated as a plain string. inputs.branch is free-text, developer-supplied
          # at workflow_dispatch time, so this is a real injection surface, not just a formatting
          # nicety — see the same fix applied throughout this workflow, and the note in
          # "Write Step Summary" below for the display bug this exact pattern caused with passwords.
          RAW_BRANCH: ${{ inputs.branch }}
        run: |
          # Sanitize the branch name for use in an sf alias (aliases don't allow "/" or other
          # punctuation branch names commonly contain), then truncate so alias + run-id suffix stays
          # comfortably within CLI alias length limits.
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//' | cut -c1-30)
          SCRATCH_ALIAS="dev-${SAFE_BRANCH}-${{ github.run_id }}"
          echo "scratch-alias=$SCRATCH_ALIAS" >> "$GITHUB_OUTPUT"

          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias "$SCRATCH_ALIAS" \
            --duration-days 30 \
            --wait 10 \
            --set-default

      # Step 5b: Install the fflib unlocked packages (Apex Enterprise Patterns) this org depends on.
      # These are our own packages, built from pinned commits of apex-enterprise-patterns'
      # fflib-apex-mocks (@6889cc0) and fflib-apex-common (@e6f3409) — see packages/apex-mocks and
      # packages/apex-common in this repo. Installed by Subscriber Package Version Id (04t...)
      # rather than deployed as source, so this org gets a fixed, versioned dependency instead of
      # re-vendoring/re-cloning fflib source. Neither version has been promoted (sf package version
      # promote) — that's fine, unpromoted unlocked package versions install into scratch orgs
      # without restriction; promotion is only required for non-scratch orgs. apex-mocks installs
      # first: apex-common has no hard dependency on it (verified against the pinned source), but
      # this keeps install order consistent with sfdx-project.json's packageDirectories order.
      - name: Install fflib Packages
        env:
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
          FFLIB_APEX_MOCKS_VERSION_ID: 04tHp000001iKqNIAU # fflib-apex-mocks 0.1.0.1
          FFLIB_APEX_COMMON_VERSION_ID: 04tHp000001iKqSIAU # fflib-apex-common 0.1.0.1
        run: |
          sf package install \
            --package "$FFLIB_APEX_MOCKS_VERSION_ID" \
            --target-org "$SCRATCH_ALIAS" \
            --wait 10 \
            --no-prompt

          sf package install \
            --package "$FFLIB_APEX_COMMON_VERSION_ID" \
            --target-org "$SCRATCH_ALIAS" \
            --wait 10 \
            --no-prompt

      # Step 5c: Resolve environment-specific placeholders in metadata that must reference a real
      # user in the target org — e.g. CustomSite siteAdmin/siteGuestRecordDefaultOwner
      # (force-app/hfs-frontend/main/default/sites/Dry_Run.site-meta.xml). Unlike deploy.yml (where
      # the target username is a fixed per-environment secret), a scratch org's username is
      # generated fresh on every create, so it has to be read back from the org itself rather than
      # from a secret. Runs before "Deploy Source to Scratch Org" so the placeholder is resolved by
      # the time that step reads force-app off disk.
      - name: Resolve Target-Org Username Placeholders
        env:
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
        run: |
          TARGET_USERNAME=$(sf org display --target-org "$SCRATCH_ALIAS" --json | jq -r '.result.username')

          grep -rl "__TARGET_USERNAME__" force-app --include="*.site-meta.xml" | while read -r f; do
            sed -i "s/__TARGET_USERNAME__/$TARGET_USERNAME/g" "$f"
          done

      # Step 6: Deploy the requested branch's source to the scratch org
      - name: Deploy Source to Scratch Org
        env:
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org "$SCRATCH_ALIAS" \
            --wait 30

      # Step 7: Generate a password so the developer can log in directly, and read back the org's
      # login URL/username. The raw JSON blobs (which contain both) are never echoed to the job log
      # — unlike the debug-heavy style used elsewhere in this repo's workflows, nothing secret is
      # safe to print here.
      #
      # TEMPORARY: GENERATED_PASSWORD is deliberately NOT masked right now (see the "Write Step
      # Summary" step below) — GitHub's ::add-mask:: applies to job step summaries too, not just the
      # log, so masking it here would also blank it out of the summary we're relying on as a
      # fallback while email delivery is broken. ACCESS_TOKEN stays masked regardless — it's a live
      # session credential, never meant to be displayed anywhere, unlike the password.
      - name: Generate Login Credentials
        id: login-info
        env:
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
        run: |
          ALIAS="$SCRATCH_ALIAS"

          PW_JSON=$(sf org generate password --target-org "$ALIAS" --json)
          GENERATED_PASSWORD=$(jq -r '.result.password' <<< "$PW_JSON")

          DISPLAY_JSON=$(sf org display --target-org "$ALIAS" --verbose --json)
          ACCESS_TOKEN=$(jq -r '.result.accessToken' <<< "$DISPLAY_JSON")
          echo "::add-mask::$ACCESS_TOKEN"

          # A scratch org's instanceUrl is its My Domain host (My Domain has been on by default for
          # new scratch orgs since Winter '18), so it's directly usable as a username/password login
          # page — no URL construction needed.
          LOGIN_URL=$(jq -r '.result.instanceUrl' <<< "$DISPLAY_JSON")
          USERNAME=$(jq -r '.result.username' <<< "$DISPLAY_JSON")

          echo "scratch-password=$GENERATED_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "scratch-login-url=$LOGIN_URL" >> "$GITHUB_OUTPUT"
          echo "scratch-username=$USERNAME" >> "$GITHUB_OUTPUT"

      # Step 8: Durable fallback — written before the email step so the org's details are visible
      # in the run even if email delivery fails.
      #
      # TEMPORARY: the password is now printed here too (not just emailed) because email delivery
      # (Step 9, "Email Developer") is currently broken. Note this is a real exposure trade-off, not
      # just a formatting choice: GitHub's ::add-mask:: applies to job step summaries as well as raw
      # logs — masking GENERATED_PASSWORD would have blanked it out of this summary too, which is
      # exactly why "Generate Login Credentials" above deliberately stopped masking it. That means
      # the password renders in plain text here to anyone with read access to this repo's Actions
      # runs, not just the requesting developer. Acceptable for now since these are 30-day throwaway
      # scratch orgs, not production data. Once email delivery is fixed: remove the password line
      # below and re-add `echo "::add-mask::$GENERATED_PASSWORD"` in "Generate Login Credentials" —
      # see the Email Developer step, left intact below.
      #
      # Bug fixed here: all the ${{ }} values below are passed through env instead of interpolated
      # directly into the echo lines. GitHub substitutes ${{ }} into this script's literal text
      # BEFORE bash runs it — a generated password containing "$" (e.g. "Qxivqexhtyj3$cmtrtau")
      # would land in the script as literal text like `Qxivqexhtyj3$cmtrtau`, and bash would then try
      # to expand $cmtrtau as an (unset, empty) variable — silently truncating the printed password
      # right at the "$". Referencing $SCRATCH_PASSWORD as a proper env var instead means bash
      # expands it exactly once, as a literal value, with no re-interpretation of its contents.
      - name: Write Step Summary
        if: always() && steps.create-scratch.outputs.scratch-alias != ''
        env:
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
          BRANCH: ${{ inputs.branch }}
          SCRATCH_USERNAME: ${{ steps.login-info.outputs.scratch-username }}
          SCRATCH_LOGIN_URL: ${{ steps.login-info.outputs.scratch-login-url }}
          SCRATCH_PASSWORD: ${{ steps.login-info.outputs.scratch-password }}
          REQUEST_EMAIL: ${{ inputs.email }}
        run: |
          {
            echo "## Scratch Org Created"
            echo ""
            echo "- Alias: \`$SCRATCH_ALIAS\`"
            echo "- Branch deployed: \`$BRANCH\`"
            echo "- Username: \`$SCRATCH_USERNAME\`"
            echo "- Login URL: $SCRATCH_LOGIN_URL"
            echo "- Expires: 30 days from creation"
            echo ""
            echo "- Password: \`$SCRATCH_PASSWORD\`"
            echo ""
            echo "_Password is also emailed to $REQUEST_EMAIL when email delivery is working; shown here as a temporary fallback while it's broken._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 9: Notify the developer by email. continue-on-error so an SMTP hiccup doesn't fail the
      # whole run — the org was still created successfully, and the Step Summary above (step 8) is
      # the fallback way to find it.
      - name: Email Developer
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER_ADDRESS }}
          server_port: ${{ secrets.SMTP_SERVER_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ inputs.email }}
          from: ${{ secrets.SMTP_FROM_ADDRESS }}
          subject: "Your Salesforce scratch org (branch: ${{ inputs.branch }}) is ready"
          body: |
            Your scratch org has been created and deployed from branch '${{ inputs.branch }}'.

            Alias: ${{ steps.create-scratch.outputs.scratch-alias }}
            Login URL: ${{ steps.login-info.outputs.scratch-login-url }}
            Username: ${{ steps.login-info.outputs.scratch-username }}
            Password: ${{ steps.login-info.outputs.scratch-password }}

            This org expires 30 days from creation.

      # Step 10: DM the requester directly on Slack with their org credentials (or a failure
      # notice), matched to the email they typed into the workflow_dispatch form. An incoming
      # webhook can only post to one fixed channel, so this needs a bot token instead — looked up
      # via users.lookupByEmail, then chat.postMessage directly with the user ID as the channel.
      # Deliberately NOT using conversations.open to get a DM channel id first: that endpoint
      # requires the im:write scope, which this bot token doesn't have (only chat:write and
      # users:read.email) — chat.postMessage accepts a user ID as "channel" and opens the DM
      # itself, so im:write is never needed.
      # continue-on-error: true for the same reason as "Email Developer" above — the org itself
      # was already created successfully, so a Slack API hiccup (bad token, user not in this
      # workspace) must not fail the whole run.
      - name: Notify Developer via Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          STATUS: ${{ job.status }}
          REQUEST_EMAIL: ${{ inputs.email }}
          BRANCH: ${{ inputs.branch }}
          SCRATCH_ALIAS: ${{ steps.create-scratch.outputs.scratch-alias }}
          SCRATCH_LOGIN_URL: ${{ steps.login-info.outputs.scratch-login-url }}
          SCRATCH_USERNAME: ${{ steps.login-info.outputs.scratch-username }}
          SCRATCH_PASSWORD: ${{ steps.login-info.outputs.scratch-password }}
        run: |
          USER_LOOKUP=$(curl -s -G -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data-urlencode "email=$REQUEST_EMAIL" \
            https://slack.com/api/users.lookupByEmail)

          if [ "$(jq -r '.ok' <<< "$USER_LOOKUP")" != "true" ]; then
            echo "::warning::Slack lookup for $REQUEST_EMAIL failed: $(jq -r '.error' <<< "$USER_LOOKUP")"
            exit 0
          fi
          SLACK_USER_ID=$(jq -r '.user.id' <<< "$USER_LOOKUP")

          # Text built via jq --arg (not string interpolation) so a branch name, password, etc.
          # containing quotes/backslashes/newlines can't break the JSON payload.
          if [ "$STATUS" = "success" ]; then
            TEXT=$(jq -n -r \
              --arg branch "$BRANCH" --arg alias "$SCRATCH_ALIAS" --arg url "$SCRATCH_LOGIN_URL" \
              --arg user "$SCRATCH_USERNAME" --arg pass "$SCRATCH_PASSWORD" \
              '"✅ Your scratch org is ready (branch: \($branch))\nAlias: \($alias)\nLogin URL: \($url)\nUsername: \($user)\nPassword: \($pass)\n\nThis org expires 30 days from creation."')
          else
            TEXT=$(jq -n -r --arg branch "$BRANCH" \
              '"❌ Your scratch org request (branch: \($branch)) failed. Check the GitHub Actions run for details."')
          fi

          POST_RESULT=$(curl -s -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$(jq -n --arg channel "$SLACK_USER_ID" --arg text "$TEXT" '{channel: $channel, text: $text}')" \
            https://slack.com/api/chat.postMessage)

          if [ "$(jq -r '.ok' <<< "$POST_RESULT")" != "true" ]; then
            echo "::warning::Slack DM post failed: $(jq -r '.error' <<< "$POST_RESULT")"
          fi

      # Note: deliberately no "Run Apex Tests" step and no "Delete Scratch Org" step here — this
      # workflow hands the developer a working environment to develop in, it doesn't validate or
      # discard one. See scratch-org-validation.yml for the PR-triggered ephemeral counterpart.
