name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  # Scoped per-PR so a rapid follow-up push cancels an in-flight review run rather than racing
  # it — this workflow's own prompt logic reads existing reviews via `gh pr view --json reviews`
  # then conditionally posts one, so two overlapping runs could both read stale state and
  # double-post or race an --approve against a --request-changes. Same pattern as
  # scratch-org-validation.yml's PR-scoped concurrency group.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Read,Grep,Glob"'
          prompt: |
            First, check whether you (this bot account) already have a review on
            this PR with "Changes Requested" status, using `gh pr view --json reviews`.

            Review the current diff for functional and logic correctness only.
            Do not flag naming conventions, formatting, or general security best
            practices — PMD (Salesforce Code Analyzer) and ESLint already enforce
            those in this repo's CI. Focus on: fflib layering violations, missing
            hfs_Response wrapping on @AuraEnabled methods, incorrect try/catch
            placement per the project's layer rules, SOQL/DML inside loops, and
            test coverage gaps. Use Read/Grep/Glob if you need to check a file the
            diff doesn't include — e.g. an existing Selector/Service class this PR
            didn't touch — to confirm whether a layering rule is actually violated.

            Then submit exactly one of the following via `gh pr review`. `gh pr review`
            fails when run non-interactively without a body, so --request-changes and
            --comment MUST always include --body "<your summary>" (or -b) — never
            invoke either without it. --approve does not require a body.
            - Real bug found: `gh pr review --request-changes --body "<summary>"`,
              listing the specific issues in the body.
            - No bugs found, and you have no prior "Changes Requested" review here:
              `gh pr review --comment --body "<summary>"` summarizing the pass. Do not
              approve — this keeps the review visible without consuming a
              required-approval slot.
            - No bugs found, and you DO have a prior "Changes Requested" review from
              an earlier run: `gh pr review --approve`, noting this clears your own
              earlier block — not a statement that no human review is needed.