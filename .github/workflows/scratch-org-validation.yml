name: Scratch Org Deploy & Test Validation

on:
  pull_request:
    branches: [ main, develop, 'release/**' ] # Triggers on PRs targeting main, develop, or any release branch
    # Default activity types (opened, synchronize, reopened, ...) apply, so every new commit
    # pushed to an open PR re-triggers this workflow, not just the PR's initial creation.

concurrency:
  # One scratch org in flight per PR. When a new commit re-triggers this workflow, the previous
  # still-running instance for the same PR is cancelled rather than left racing a second scratch org.
  group: scratch-org-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scratch-org-validation:
    name: Deploy & Test on Scratch Org
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the PR's changes merged onto the target branch (not just the feature branch in isolation).
      # refs/pull/<n>/merge is a commit GitHub computes and keeps up to date automatically for every
      # open, cleanly-mergeable PR — we don't perform the merge ourselves, we just check out GitHub's
      # existing result of it. If the PR has real conflicts, this ref won't exist and checkout fails,
      # which is itself a useful signal (don't scratch-org-test something that isn't mergeable yet).
      - name: Checkout PR Merge Commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # Step 2: Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 hits a crash in @salesforce/cli's bundled undici
          # (calls worker_threads.markAsUncloneable, added only in Node >=22.10)
          node-version: 22

      # Step 3: Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # --- Original JWT bearer flow auth, kept for reference / possible revert — commented out, not deleted ---
      # We moved off this because our Dev Hub was set up against a custom External Client App (ECA),
      # which the scratch-org signup service couldn't replicate into newly created scratch orgs
      # (C-1016 / RemoteOrgSignupFailed). See the Auth URL step below for the replacement.
      #
      # - name: Authenticate Dev Hub (JWT Bearer Flow)
      #   env:
      #     DEVHUB_JWT_KEY: ${{ secrets.DEVHUB_JWT_KEY }}
      #     DEVHUB_CONSUMER_KEY: ${{ secrets.DEVHUB_CONSUMER_KEY }}
      #     DEVHUB_USERNAME: ${{ secrets.DEVHUB_USERNAME }}
      #   run: |
      #     echo "$DEVHUB_JWT_KEY" > server.key
      #     echo "DEBUG: DEVHUB_USERNAME = $DEVHUB_USERNAME"
      #     echo "DEBUG: DEVHUB_CONSUMER_KEY (masked) = ${DEVHUB_CONSUMER_KEY:0:6}...${DEVHUB_CONSUMER_KEY: -4} (length ${#DEVHUB_CONSUMER_KEY})"
      #     echo "DEBUG: server.key line count = $(wc -l < server.key)"
      #     echo "DEBUG: server.key has PEM header = $(grep -c '\-----BEGIN' server.key)"
      #     echo "DEBUG: server.key has PEM footer = $(grep -c '\-----END' server.key)"
      #     sf org login jwt \
      #       --client-id "$DEVHUB_CONSUMER_KEY" \
      #       --jwt-key-file server.key \
      #       --username "$DEVHUB_USERNAME" \
      #       --set-default-dev-hub \
      #       --alias devhub
      #     echo "DEBUG: post-login org info:"
      #     sf org display --target-org devhub --verbose
      #     echo "DEBUG: full org list after login:"
      #     sf org list
      #     rm server.key
      # --- end original JWT auth ---

      # Step 4: Authenticate to the Dev Hub using a stored Auth URL — i.e. reusing a normal, one-time
      # interactive login (`sf org login web`), rather than the JWT bearer flow.
      # We moved off JWT because our Dev Hub was set up against a custom External Client App (ECA),
      # which the scratch-org signup service couldn't replicate into newly created scratch orgs
      # (C-1016 / RemoteOrgSignupFailed). A plain web login authenticates through Salesforce CLI's own
      # built-in OAuth client instead of a custom app, sidestepping that failure mode entirely.
      # SFDX_AUTH_URL is generated once, manually, via:
      #   sf org login web --alias <alias>
      #   sf org display --target-org <alias> --verbose   (copy the "Sfdx Auth Url" field)
      # It embeds a refresh token, so unlike a cert-based JWT setup it can occasionally be invalidated
      # (password change, revoked connected app access, session policy change) and need regenerating —
      # a manual, infrequent maintenance step, not something that affects normal automated runs.
      - name: Authenticate Dev Hub (Auth URL)
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > authfile

          # ---- Debug: confirm the secret looks non-empty without ever printing the refresh token itself ----
          echo "DEBUG: authfile length = $(wc -c < authfile) bytes"

          sf org login sfdx-url \
            --sfdx-url-file authfile \
            --set-default-dev-hub \
            --alias devhub

          echo "DEBUG: post-login org info:"
          sf org display --target-org devhub --verbose
          echo "DEBUG: full org list after login:"
          sf org list

          # Remove the auth file immediately after use, minimizing exposure of the embedded refresh
          # token on the runner (the runner VM itself is destroyed after the job either way).
          rm authfile

      # --- Original signup workaround for the ECA-based JWT auth above — commented out, not deleted.
      # Not needed with Auth URL (no custom ECA involved), but keep this here in case we revert to JWT.
      #
      # env:
      #   SF_SCRATCH_SIGNUP_CONNECTED_APP: PlatformCLI
      #   SF_SCRATCH_SIGNUP_CALLBACK_URL: http://localhost:1717/OauthRedirect
      # --- end original signup workaround ---

      # Step 5: Create a fresh, empty scratch org for this PR.
      - name: Create Scratch Org
        id: create-scratch
        run: |
          echo "DEBUG: org list right before create scratch:"
          sf org list

          # Alias includes both the PR number (for human traceability in `sf org list`) and the run ID
          # (for uniqueness across re-runs/re-pushes of the same PR).
          SCRATCH_ALIAS="pr-${{ github.event.pull_request.number }}-${{ github.run_id }}"
          # Recorded to $GITHUB_OUTPUT *before* the org actually gets created, so the alias is available
          # to the cleanup step even if this run gets cancelled while "sf org create scratch" is executing
          # (e.g. a follow-up commit cancelling this run via the concurrency group above).
          echo "scratch-alias=$SCRATCH_ALIAS" >> "$GITHUB_OUTPUT"
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias "$SCRATCH_ALIAS" \
            --duration-days 1 \
            --wait 10 \
            --set-default
          # --duration-days 1 (the shortest allowed) is a self-cleanup safety net: even in the rare
          # case where the "Delete Scratch Org" step never runs, this org auto-expires within a day
          # instead of sitting around consuming Dev Hub scratch-org quota indefinitely.

      # Step 6: Deploy the merged source to the scratch org
      - name: Deploy Source to Scratch Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org "${{ steps.create-scratch.outputs.scratch-alias }}" \
            --wait 30

      # Step 7: Run local Apex tests with code coverage, capturing JSON results for gate checks.
      # continue-on-error: true is required here — "sf apex run test" exits non-zero on any test
      # failure, but the job must still proceed to the "Enforce Test Pass & Coverage Gates" step
      # (which does the real pass/fail parsing and writes the PR-visible summary) and to the
      # "Delete Scratch Org" cleanup step afterward, rather than dying on this step's exit code.
      - name: Run Apex Tests (RunLocalTests)
        id: run-tests
        continue-on-error: true
        run: |
          mkdir -p test-results
          sf apex run test \
            --target-org "${{ steps.create-scratch.outputs.scratch-alias }}" \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format json \
            --output-dir test-results \
            --wait 30 \
            --synchronous \
            > test-results/run-test-stdout.json

      # Step 8: Fail the PR if any test failed, or if any individual class is under 75% coverage
      # (a per-class minimum — stricter than Salesforce's own 75% org-wide deploy check).
      # Field names below (result.summary.*, result.coverage.coverage[].coveredPercent) match the
      # current "sf apex run test --result-format json" schema; this has drifted slightly across
      # CLI versions historically, so re-verify with one manual run if this step ever misbehaves.
      - name: Enforce Test Pass & Coverage Gates
        id: enforce-gates
        run: |
          RESULTS_FILE="test-results/run-test-stdout.json"

          if [ ! -s "$RESULTS_FILE" ]; then
            echo "::error::Test results file missing or empty — sf apex run test likely crashed before producing output."
            echo "## ❌ Apex Test Run Failed to Produce Results" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          OUTCOME=$(jq -r '.result.summary.outcome' "$RESULTS_FILE")
          TESTS_RAN=$(jq -r '.result.summary.testsRan' "$RESULTS_FILE")
          PASSING=$(jq -r '.result.summary.passing' "$RESULTS_FILE")
          FAILING=$(jq -r '.result.summary.failing' "$RESULTS_FILE")
          ORG_WIDE_COVERAGE=$(jq -r '.result.summary.orgWideCoverage // "n/a"' "$RESULTS_FILE")

          # ---- Gate 1: any failing test ----
          FAILED_TESTS_MD=$(jq -r '
            [.result.tests[]? | select(.Outcome == "Fail")]
            | if length == 0 then "" else
                (["| Test | Message |", "|------|---------|"] +
                 (map("| " + .FullName + " | " + ((.Message // "") | gsub("\\|"; "\\|") | gsub("\n"; " ")) + " |")))
                | join("\n")
              end
          ' "$RESULTS_FILE")

          # ---- Gate 2: any class under 75% coverage ----
          UNDER_COVERED_MD=$(jq -r '
            [.result.coverage.coverage[]?
              | select(.coveredPercent < 75)
              | {name, coveredPercent, totalLines, totalCovered}]
            | if length == 0 then "" else
                (["| Class | Coverage | Covered/Total Lines |", "|-------|----------|---------------------|"] +
                 (map("| " + .name + " | " + (.coveredPercent | tostring) + "% | "
                      + (.totalCovered | tostring) + "/" + (.totalLines | tostring) + " |")))
                | join("\n")
              end
          ' "$RESULTS_FILE")

          UNDER_COVERED_COUNT=$(jq '[.result.coverage.coverage[]? | select(.coveredPercent < 75)] | length' "$RESULTS_FILE")

          # ---- Write step summary (always, pass or fail) ----
          {
            echo "## Apex Test Results"
            echo ""
            echo "- Outcome: **$OUTCOME**"
            echo "- Tests ran: $TESTS_RAN (passing: $PASSING, failing: $FAILING)"
            echo "- Org-wide coverage: $ORG_WIDE_COVERAGE"
            echo ""
            if [ -n "$FAILED_TESTS_MD" ]; then
              echo "### ❌ Failing Tests"
              echo "$FAILED_TESTS_MD"
              echo ""
            fi
            if [ -n "$UNDER_COVERED_MD" ]; then
              echo "### ⚠️ Classes Below 75% Coverage"
              echo "$UNDER_COVERED_MD"
              echo ""
            fi
            if [ -z "$FAILED_TESTS_MD" ] && [ -z "$UNDER_COVERED_MD" ]; then
              echo "✅ All tests passed and every class meets the 75% per-class coverage minimum."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- Final gate decision ----
          # Computed and exited on last, after the step summary above is already written — a step's
          # later commands still run right up until "exit" is called, so ordering the summary write
          # before this ensures the markdown tables render in the Actions UI even when we then fail.
          EXIT_CODE=0
          if [ "$FAILING" -gt 0 ]; then
            echo "::error::$FAILING Apex test(s) failed."
            EXIT_CODE=1
          fi
          if [ "$UNDER_COVERED_COUNT" -gt 0 ]; then
            echo "::error::$UNDER_COVERED_COUNT class(es) below 75% coverage."
            EXIT_CODE=1
          fi
          exit $EXIT_CODE

      # Step 9: Always delete the scratch org, regardless of pass/fail, so it doesn't burn Dev Hub quota.
      # Guard on the output (set before "sf org create scratch" runs) rather than the step's outcome,
      # so cleanup still fires if this run was cancelled/abandoned mid-creation (e.g. a newer commit's
      # run cancelling this one via the concurrency group above) instead of only on a clean success.
      - name: Delete Scratch Org
        if: always() && steps.create-scratch.outputs.scratch-alias != ''
        run: |
          sf org delete scratch \
            --target-org "${{ steps.create-scratch.outputs.scratch-alias }}" \
            --no-prompt
