<template>
  <article class={cardClass} tabindex="0" aria-label={ariaLabel}>
    <template lwc:if={course.isNewRelease}>
      <span class="hfs-new-badge">{labels.newBadge}</span>
    </template>

    <p class="hfs-card-category">{course.category}</p>
    <h3 class="hfs-card-title">{course.title}</h3>

    <span class={statusChipClass} role="status">{statusLabel}</span>

    <template lwc:if={course.description}>
      <p class="hfs-card-desc">{course.description}</p>
    </template>

    <p class="hfs-card-meta">{metaLine}</p>

    <template lwc:if={isInProgress}>
      <div class="hfs-card-progress">
        <div
          class="hfs-card-progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow={course.percentComplete}
        >
          <div class="hfs-card-progress-fill" style={progressStyle}></div>
        </div>
        <p class="hfs-card-module">{moduleLine}</p>
      </div>
    </template>

    <template lwc:if={isCompleted}>
      <p class="hfs-card-completion">{completionLine}</p>
    </template>

    <template lwc:if={dueLine}>
      <p class={dueClass}>{dueLine}</p>
    </template>

    <!-- HFS-34 action row: status-appropriate actions with per-action busy state -->
    <div class="hfs-card-actions">
      <template lwc:if={isNotStarted}>
        <lightning-button
          label={labels.actionStart}
          variant="brand"
          onclick={handleStart}
          disabled={isBusy}
          class="hfs-action-primary"
        ></lightning-button>
        <template lwc:if={isStartBusy}>
          <lightning-spinner
            size="small"
            alternative-text={labels.busy}
          ></lightning-spinner>
        </template>
      </template>

      <template lwc:if={isInProgress}>
        <lightning-button
          label={labels.actionResume}
          variant="brand"
          onclick={handleResume}
          disabled={isBusy}
          class="hfs-action-primary"
        ></lightning-button>
        <template lwc:if={isResumeBusy}>
          <lightning-spinner
            size="small"
            alternative-text={labels.busy}
          ></lightning-spinner>
        </template>
      </template>

      <template lwc:if={isCompleted}>
        <lightning-button
          label={labels.actionViewCertificate}
          variant="success"
          onclick={handleViewCertificate}
          disabled={isBusy}
          class="hfs-action-cert"
        ></lightning-button>
        <lightning-button
          label={labels.actionRetake}
          variant="neutral"
          onclick={handleRetake}
          disabled={isBusy}
          class="hfs-action-retake"
        ></lightning-button>
        <template lwc:if={isViewCertificateBusy}>
          <lightning-spinner
            size="small"
            alternative-text={labels.busy}
          ></lightning-spinner>
        </template>
        <template lwc:if={isRetakeBusy}>
          <lightning-spinner
            size="small"
            alternative-text={labels.busy}
          ></lightning-spinner>
        </template>
      </template>
    </div>

    <template lwc:if={retryMessage}>
      <p class="hfs-card-retry" role="alert" aria-live="assertive">
        {retryMessage}
      </p>
    </template>
  </article>
</template>
