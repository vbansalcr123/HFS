<template>
  <template lwc:if={hasCourses}>
    <div class="hfs-course-grid">
      <template for:each={displayCourses} for:item="item">
        <c-hfs_training-course-card
          key={item.course.id}
          course={item.course}
          busy-action={item.busyAction}
          retry-message={item.retryMessage}
        ></c-hfs_training-course-card>
      </template>
    </div>
  </template>
  <template lwc:else>
    <div class="hfs-empty" role="status" aria-live="polite">
      <lightning-icon
        icon-name="utility:search"
        size="small"
        alternative-text={labels.emptyState}
      ></lightning-icon>
      <p class="hfs-empty-text">{labels.emptyState}</p>
    </div>
  </template>
</template>
