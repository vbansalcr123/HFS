<template>
    <lightning-card title="High Risk Opportunities" icon-name="standard:opportunity">
        <div class="slds-p-horizontal_small">
            <template if:true={hasOpportunities}>
                <template for:each={opportunities} for:item="opp">
                    <p key={opp.Id}>{opp.Name} — {opp.StageName}</p>
                </template>
            </template>
            <template if:false={hasOpportunities}>
                <p>No high risk opportunities found.</p>
            </template>
        </div>
    </lightning-card>
</template>
